services:
  db:
    container_name: db
    image: postgres:18.2-alpine3.22
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    ports:
      - 127.0.0.1:5432:5432

    volumes:
      - cust_dev_ai_pg_data:/var/lib/postgresql/data

    networks:
      - backend_network

    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

networks:
  backend_network:
    driver: bridge

volumes:
  cust_dev_ai_pg_data:
    driver: local
