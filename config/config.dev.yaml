app_host: "0.0.0.0"
app_port: 8000
log_level: "DEBUG"
workers_number: 1

persona:
  graph_recursion_limit: 100

interview:
  recursion_limit: 10
  simulation_recursion_limit: 80

postgres:
  pool_size: 5
  max_overflow: 10
  echo: false

redis:
  host: redis
  port: 6379
  db: 0
  max_connections: 10

minio:
  endpoint: "minio:9000"
  bucket_name: "custdev-reports"
  secure: false
  region: "us-east-1"
  presigned_url_expire_seconds: 3600
  offload_sync_calls: true

rabbitmq:
  host: "rabbitmq"
  port: 5672
  vhost: "ml"

llm:
  model_name: "qwen/qwen3.5-27b"
  base_url: "https://openrouter.ai/api/v1"
  temperature: 0.1
  max_tokens: 4096
