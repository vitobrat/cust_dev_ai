app_host: "0.0.0.0"
app_port: 8000
log_level: "DEBUG"
workers_number: 1

persona:
  prompts_dir: "src/domains/persona/infrastructure/prompt"
  graph_recursion_limit: 5

postgres:
  pool_size: 5
  max_overflow: 10
  echo: false

redis:
  max_connections: 10

llm:
  model_name: "openai/gpt-oss-120b"
  base_url: "https://openrouter.ai/api/v1/chat/completions"
  temperature: 0.1
  max_tokens: 4096
