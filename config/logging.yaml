version: 1

formatters:
  json_formatter:
    '()': config.log.formatters.LogsJsonFormatter
    format: '%(levelname)s %(asctime)s %(module)s %(lineno)d %(message)s '
    datefmt: '%Y-%m-%d %H:%M:%S'
    json_ensure_ascii: False
  fluent_fmt:
    '()': fluent.handler.FluentRecordFormatter
    format:
      level: '%(levelname)s'
      datetime: '%(asctime)s'
      msg: '%(message)s'
      module: '%(module)s'
      line: '%(lineno)s'
    datefmt: '%Y-%m-%d %H:%M:%S'

handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: json_formatter
    stream: ext://sys.stdout
  fluent:
    class: fluent.handler.FluentHandler
    host: 127.0.0.1
    port: 24224
    tag: consumer.logs
    buffer_overflow_handler: overflow_handler
    formatter: fluent_fmt
    level: DEBUG
  none:
    class: logging.NullHandler

loggers:
  amqp:
    handlers: [ none ]
    propagate: False
  conf:
    handlers: [ none ]
    propagate: False
  urllib3.util.retry:
    handlers: [ none ]
    propagate: False
  multipart.default:
    handlers: [ none ]
    propagate: False
    level: WARNING
  uvicorn.default:
    handlers: [ console ]
    level: INFO
    propagate: False
  uvicorn.access:
    handlers: [ console ]
    level: INFO
    propagate: False
  uvicorn.error:
    handlers: [ console ]
    level: INFO
    propagate: False
  httpx:
    handlers: [ none ]
    propagate: false
    level: ERROR
  httpcore:
    handlers: [ none ]
    propagate: false
    level: ERROR
  urllib3:
    handlers: [ none ]
    propagate: false
    level: ERROR
  '': # root logger
    handlers: [ console, fluent ]
    level: DEBUG
    propagate: False

disable_existing_loggers: True
